plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.12'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

def javaVersion = JavaVersion.toVersion(project.javaVersion)

repositories {
    // AdvancedChatBox, published locally with `publishToMavenLocal`.
    mavenLocal()
    mavenCentral()
    maven { name = 'FabricMC'; url = 'https://maven.fabricmc.net/' }
}

dependencies {
    // 26.x ships unobfuscated — no Yarn/Mojang mappings, Loom does not remap.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // AdvancedChatBox provides the SpellCheckLanguageProvider API and the LanguageTool engine at
    // runtime; compile against it only (transitive=false so we don't try to resolve its minecraft dep).
    compileOnly("io.github.darkkronicle:AdvancedChatBox:${project.box_version}") { transitive = false }
    compileOnly "org.languagetool:languagetool-core:${project.languagetool_version}"

    // The English language data (bundle only the language-en artifact; the shared engine — core,
    // morfologik, hunspell, hppc — comes from Box) plus opennlp, which is English-specific POS/chunk/
    // tokenize data (~9 MB) that English's rules need and Box no longer ships.
    implementation "org.languagetool:language-en:${project.languagetool_version}"
    include("org.languagetool:language-en:${project.languagetool_version}") {
        transitive = false
    }
    include group: 'org.apache.opennlp', name: 'opennlp-tools', version: '1.9.3'
    include group: 'edu.washington.cs.knowitall', name: 'opennlp-chunk-models', version: '1.5'
    include group: 'edu.washington.cs.knowitall', name: 'opennlp-postag-models', version: '1.5'
    include group: 'edu.washington.cs.knowitall', name: 'opennlp-tokenize-models', version: '1.5'
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = Integer.parseInt(project.javaVersion)
}

java {
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}

jar {
    from 'LICENSE.txt'
}
